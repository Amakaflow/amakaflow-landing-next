# CodeRabbit configuration — AmakaFlow Landing Page
language: "en-US"

reviews:
  profile: "assertive"
  auto_review:
    enabled: true
    drafts: false
  # AMA: CodeRabbit is for CODE only. Doc-only PRs must not consume CR credits.
  path_filters:
    - "!**/*.md"
    - "!**/*.mdx"
    - "!docs/**"
    - "!**/CHANGELOG*"
    - "!**/LICENSE*"
    - "!**/*.txt"

knowledge_base:
  # AMA: org-wide learnings so a lesson taught on one repo applies everywhere.
  learnings:
    scope: global
  linear:
    usage: enabled
    team_keys:
      - "AMA"
  mcp:
    usage: enabled
